services:
  postgres:
    image: postgres:16-alpine
    container_name: supportdesk-postgres
    environment:
      POSTGRES_DB: supportdesk
      POSTGRES_USER: supportdesk
      POSTGRES_PASSWORD: supportdesk
    ports:
      - "5432:5432"
    volumes:
      - supportdesk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportdesk -d supportdesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: node:24-alpine
    container_name: supportdesk-api
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @supportdesk/api dev"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      API_PORT: 3001
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://supportdesk:supportdesk@postgres:5432/supportdesk?schema=public
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - ..:/workspace
      - supportdesk-node-modules:/workspace/node_modules
      - supportdesk-node-store:/root/.local/share/pnpm/store

  web:
    image: node:24-alpine
    container_name: supportdesk-web
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @supportdesk/web dev --hostname 0.0.0.0"
    depends_on:
      - api
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_APP_NAME: SupportDesk
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
    ports:
      - "3000:3000"
    volumes:
      - ..:/workspace
      - supportdesk-node-modules:/workspace/node_modules
      - supportdesk-node-store:/root/.local/share/pnpm/store

volumes:
  supportdesk-postgres-data:
  supportdesk-node-modules:
  supportdesk-node-store:
